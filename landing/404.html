<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dumply — 페이지를 찾을 수 없어요 · 404</title>
  <meta name="robots" content="noindex" />

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css" />

  <link rel="icon" type="image/png" href="/icons/favicon.png" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/hub.css" />
</head>
<body>
  <div class="field" aria-hidden="true">
    <span class="blob blob--a"></span>
    <span class="blob blob--b"></span>
    <span class="blob blob--c"></span>
    <span class="grain"></span>
  </div>

  <header class="nav" id="nav">
    <a class="brand" href="/" aria-label="Dumply 홈">
      <img class="brand__mark" src="/icons/icon-512.png" alt="" width="28" height="28" />
      <span class="brand__name">Dumply</span>
    </a>
    <nav class="nav__links" aria-label="주요">
      <a href="/guide">사용 방법</a>
      <a href="/pricing">가격</a>
      <a href="/changelog">업데이트</a>
      <a href="/support">문의</a>
    </nav>
    <a class="btn btn--solid nav__cta" href="/#products">
      <span>Chrome에 추가</span>
      <span class="btn__tag">무료</span>
    </a>
  </header>

  <main class="hub" id="top">
    <header class="hub__head">
      <p class="hub__eyebrow">404 · Not Found</p>
      <h1>이 페이지는 어디론가 쏟아져 버렸어요</h1>
      <p class="hub__lead">
        주소가 바뀌었거나 없는 페이지예요. 알프레도가 대신 길을 안내해 드릴게요.<br />
        The page you're looking for doesn't exist. · お探しのページは見つかりませんでした。
      </p>
      <p style="margin-top:18px">
        <a class="btn btn--solid" href="/"><span>홈으로 가기</span></a>
        <a class="btn btn--ghost" href="/guide" style="margin-left:8px"><span>사용 방법 보기</span></a>
      </p>
    </header>

    <nav class="foot__links" aria-label="언어" style="margin-top:20px">
      <a href="/" hreflang="ko" lang="ko">한국어</a>
      <a href="/en" hreflang="en" lang="en">English</a>
      <a href="/ja" hreflang="ja" lang="ja">日本語</a>
    </nav>
  </main>
</body>
</html>
