<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout · Dumply</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="icons/icon-32.png" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           background: #faf8f5; color: #333; }
    .box { text-align: center; padding: 24px; }
    .box img { width: 56px; height: 56px; border-radius: 14px; }
    .hint { color: #888; font-size: 14px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="box">
    <img src="icons/icon-128.png" alt="Dumply" />
    <h1>Dumply Checkout</h1>
    <p class="hint" id="status">Loading secure checkout…</p>
  </div>

  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <script>
    // 샌드박스 테스트 중에만 유지 — 라이브 전환 시 아래 줄 삭제
    Paddle.Environment.set('sandbox');
    Paddle.Initialize({
      token: 'test_b4042ebc1ecb0bda95a63b11106', // 샌드박스 클라이언트 토큰 — 라이브 전환 시 live_ 토큰으로 교체
    });
    // URL에 ?_ptxn=txn_... 이 있으면 Paddle.js가 결제 오버레이를 자동으로 띄움
    if (!new URLSearchParams(location.search).has('_ptxn')) {
      document.getElementById('status').textContent =
        'No transaction found. Start checkout from the Dumply extension.';
    }
  </script>
</body>
</html>
